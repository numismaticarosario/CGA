<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGA — Access Denied</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c10;
      color: #e2e8f0;
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 48px;
      border: 1px solid #1c2333;
      max-width: 400px;
    }
    .code {
      font-family: 'DM Mono', monospace;
      font-size: 48px;
      color: #f56565;
      font-weight: 300;
      margin-bottom: 16px;
    }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: #4a5568;
      margin-bottom: 32px;
    }
    a {
      color: #00e5a0;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">403</div>
    <h1>Access Denied</h1>
    <p>Your email is not authorized to access this dashboard.</p>
    <a href="/auth/logout">← Sign out and try another account</a>
  </div>
</body>
</html>
