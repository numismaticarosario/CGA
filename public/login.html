<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGA — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080c10;
      --surface: #0d1117;
      --border: #1c2333;
      --accent: #00e5a0;
      --accent-dim: rgba(0, 229, 160, 0.12);
      --text: #e2e8f0;
      --muted: #4a5568;
      --danger: #f56565;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,160,0.05) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 56px 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 0 1px rgba(0,229,160,0.05), 0 32px 64px rgba(0,0,0,0.6);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--accent);
      display: grid;
      place-items: center;
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text);
    }

    .logo-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 36px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .google-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 20px rgba(0,229,160,0.08);
    }

    .google-btn svg {
      flex-shrink: 0;
    }

    .error-msg {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(245, 101, 101, 0.1);
      border: 1px solid rgba(245, 101, 101, 0.3);
      border-radius: 2px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--danger);
      letter-spacing: 0.04em;
    }

    .footer-note {
      margin-top: 32px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-mark">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 17l4-8 4 4 4-6 4 10H3z"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">CGA</div>
        <div class="logo-sub">Pair Trading Monitor</div>
      </div>
    </div>

    <h1>Access Dashboard</h1>
    <p class="subtitle">// Authorized users only</p>

    <div class="divider"></div>

    <a href="/auth/google" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </a>

    <div id="error-container"></div>

    <p class="footer-note">Access restricted to authorized accounts</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'auth_failed') {
      document.getElementById('error-container').innerHTML =
        '<div class="error-msg">Authentication failed. Please try again.</div>';
    }
  </script>
</body>
</html>
